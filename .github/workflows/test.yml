name: Test & Coverage

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Linux and Windows run on every pull request. macOS runs when the pull
  # request changes a file macOS behavior depends on, Package Smoke keeps it
  # on the release pull request, and a workflow_dispatch run puts every job
  # on every operating system.
  plan:
    name: Plan Test Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      os: ${{ steps.plan.outputs.os }}
      package-os: ${{ steps.plan.outputs.package-os }}
      reason: ${{ steps.plan.outputs.reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Choose the operating systems
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          all_os='["ubuntu-latest","windows-latest","macos-latest"]'
          if [ "$EVENT_NAME" != pull_request ]; then
            os=$all_os
            package_os=$all_os
            reason="A $EVENT_NAME run puts every job on every operating system."
          else
            # The three-dot diff holds what the pull request itself changes,
            # and --no-renames lists a moved file under its old path as well.
            changed=$(mktemp)
            trap 'rm -f "$changed"' EXIT
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$changed"
            macos_path=''
            while IFS= read -r -d '' path; do
              case "$path" in
                scripts/windows/* | scripts/linux/*) ;;
                scripts/* | tests/* | pyproject.toml | uv.lock | .python-version | .github/workflows/test.yml)
                  macos_path=$path
                  break
                  ;;
              esac
            done < "$changed"
            if [ -n "$macos_path" ]; then
              printf 'macOS is needed for %q\n' "$macos_path"
              os=$all_os
              reason='macOS runs: the pull request changes code, tests or packaging that macOS behavior depends on.'
            else
              os='["ubuntu-latest","windows-latest"]'
              reason='macOS left out: the pull request changes nothing macOS behavior depends on.'
            fi
            package_os=$os
            case "$HEAD_REF" in
              release-please--branches--*)
                package_os=$all_os
                reason="$reason Package Smoke runs on macOS for the release pull request."
                ;;
            esac
          fi
          echo "$reason"
          {
            echo "os=$os"
            echo "package-os=$package_os"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test Python on ${{ matrix.os }}
    needs: plan
    if: ${{ ! startsWith(github.head_ref, 'release-please--branches--') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run pytest with coverage
        run: uv run pytest -v --cov=scripts --cov-report=term-missing --cov-report=xml --cov-report=html --junit-xml=test-results.xml --ignore=tests/e2e/ tests/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml

      - name: Upload coverage reports
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

      - name: Surface test results
        if: always()
        uses: pmeier/pytest-results-action@v0.8.0
        with:
          path: test-results.xml
          summary: true
          display-options: fEX
          fail-on-empty: true

      - name: Coverage comment
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

  test-install-scripts:
    name: Test Install Scripts
    needs: plan
    if: ${{ ! startsWith(github.head_ref, 'release-please--branches--') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Test setup_environment.py imports
        run: |
          uv run python -c "import sys; sys.path.insert(0, 'scripts'); import setup_environment"

      - name: Test install_claude.py imports
        run: |
          uv run python -c "import sys; sys.path.insert(0, 'scripts'); import install_claude"

  e2e-tests:
    name: E2E Tests (${{ matrix.os }})
    needs: plan
    if: ${{ ! startsWith(github.head_ref, 'release-please--branches--') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Claude Code binary for real-binary E2E tests
        shell: bash
        run: |
          uv run python scripts/install_claude.py
          echo "${USERPROFILE:-$HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Install cron for the real-scheduler E2E test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cron

      - name: Run E2E tests
        env:
          CLAUDE_CODE_TOOLBOX_REQUIRE_REAL_BINARY: '1'
          CLAUDE_CODE_TOOLBOX_E2E_REAL_SCHEDULER: '1'
          CLAUDE_CODE_TOOLBOX_E2E_REAL_TRUST_STORE: '1'
        run: uv run pytest tests/e2e/ -v --tb=long --junit-xml=e2e-results.xml

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.os }}
          path: e2e-results.xml

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-debug-${{ matrix.os }}
          path: |
            ${{ runner.temp }}
          retention-days: 5

      - name: Verify no artifacts in real home
        shell: bash
        run: |
          echo "Checking for leaked E2E test artifacts..."

          LEAKED=0

          # Check ~/.claude for e2e-test patterns
          if ls ~/.claude/*e2e* 2>/dev/null; then
            echo "ERROR: Found e2e artifacts in ~/.claude/"
            LEAKED=1
          fi

          # Check ~/.local/bin for e2e-test patterns
          if ls ~/.local/bin/*e2e* 2>/dev/null; then
            echo "ERROR: Found e2e artifacts in ~/.local/bin/"
            LEAKED=1
          fi

          # Check ~/.config/claude for e2e-test patterns (Linux/macOS)
          if ls ~/.config/claude/*e2e* 2>/dev/null; then
            echo "ERROR: Found e2e artifacts in ~/.config/claude/"
            LEAKED=1
          fi

          # Check for .mcp.json in project root (created by project-scoped MCP servers)
          if [ -f ".mcp.json" ]; then
            echo "ERROR: Found .mcp.json artifact in project root!"
            echo "Contents:"
            cat .mcp.json
            LEAKED=1
          fi

          if [ "$LEAKED" -eq 1 ]; then
            echo "FAILURE: E2E test artifacts leaked to real home directory!"
            exit 1
          fi

          echo "SUCCESS: No leaked E2E test artifacts found"

  package-smoke:
    # Deliberately NOT guarded by the release-please branch filter: the release
    # PR carries the exact commit that gets published, so it must be validated,
    # on macOS as well (the plan's package-os holds every operating system there).
    name: Package Smoke (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.package-os) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build distributions
        run: uv build

      - name: Resolve wheel path
        id: wheel
        shell: bash
        run: echo "path=$(ls dist/*.whl)" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the wheel via uvx
        shell: bash
        run: |
          uvx --from "${{ steps.wheel.outputs.path }}" cc-toolbox --help
          uvx --from "${{ steps.wheel.outputs.path }}" cc-toolbox setup --help
          uvx --from "${{ steps.wheel.outputs.path }}" cc-toolbox install --help
          uvx --from "${{ steps.wheel.outputs.path }}" cc-toolbox setup ./tests/fixtures/packaging_smoke.yaml --dry-run --skip-install --yes
          # Step 1 dispatch inside the real uvx environment: the bundled
          # installer must launch under the environment's own interpreter.
          uvx --from "${{ steps.wheel.outputs.path }}" python tests/fixtures/packaging_smoke_step1.py
          # Step 23 inside the real uvx environment: a source run refreshes a
          # dependent profile through python -m cc_toolbox.cli setup.
          uvx --from "${{ steps.wheel.outputs.path }}" python tests/fixtures/packaging_smoke_links.py

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [plan, test, test-install-scripts, e2e-tests, package-smoke]
    if: ${{ always() }}
    permissions: {}

    steps:
      - name: Summary
        id: summary
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INSTALL_SCRIPTS_RESULT: ${{ needs.test-install-scripts.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
          OS: ${{ needs.plan.outputs.os }}
          PACKAGE_OS: ${{ needs.plan.outputs.package-os }}
          REASON: ${{ needs.plan.outputs.reason }}
        run: |
          # A job that succeeded or was skipped passes and any other result
          # fails the summary. A macOS entry the plan left out is not a job,
          # so it never appears here as a failure.
          failed=0
          rows=''
          add_row() {
            systems=-
            case "$2" in
              success | failure | cancelled)
                systems=${3#\[}
                systems=${systems%\]}
                systems=${systems//[\" ]/}
                systems=${systems//,/, }
                ;;
            esac
            case "$2" in
              success | skipped) ;;
              *) failed=1 ;;
            esac
            rows+="| $1 | $systems | $2 |"$'\n'
          }
          add_row 'Plan Test Matrix' "$PLAN_RESULT" '["ubuntu-latest"]'
          add_row 'Test Python' "$TEST_RESULT" "$OS"
          add_row 'Test Install Scripts' "$INSTALL_SCRIPTS_RESULT" "$OS"
          add_row 'E2E Tests' "$E2E_RESULT" "$OS"
          add_row 'Package Smoke' "$PACKAGE_SMOKE_RESULT" "$PACKAGE_OS"
          {
            echo '## Test Summary'
            echo
            echo "${REASON:-The plan job chose no operating systems.}"
            echo
            echo '| Job | Operating systems | Result |'
            echo '| --- | --- | --- |'
            printf '%s' "$rows"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$failed"
